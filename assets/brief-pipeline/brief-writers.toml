# KNOWN-INCOMPLETE, and deliberately so. This artifact has no canonical literal:
# brief-shuffle-fast-drain.py builds the path from PILE_MANIFEST_NAME, while
# decisions-to-briefs/SKILL.md writes ".pile/manifest.jsonl" in prose. Measured
# 2026-08-20: each literal finds exactly ONE of the two known writers and misses
# the other. The bare literal "manifest.jsonl" was worse -- it also matches
# decisions-track/manifest.jsonl, and five referencers registered here were in
# fact decisions-track-only. A ".pile" literal was worse in the other direction:
# 38 files, because .pile matches .rejected/ and .no-brainer/ too.
# So the union is used, and B2.14's judgement clause also applies to this
# artifact: a mechanical pass here is not evidence that no other writer exists.

