# BRIEF ARTIFACT WRITER REGISTER (POLICY B2.11 / B2.12).
#
# Principle (owner, 2026-08-20): repeated work goes behind `mctl`, which is the
# single point of failure BY DESIGN -- a thing that fails in one place is a
# thing you can fix in one place.
#
# DETECTION: BY FILE ROLE, and TWO EARLIER DETECTORS WERE DISCARDED.
#   1. A write-idiom proximity heuristic classified brief-shuffle-fast-drain.py
#      as read-only for .index.jsonl when append_index() writes it -- the idiom
#      lives in a helper far from the literal.
#   2. A ```-fence extractor missed formulas/brief-shuffle.toml, which has ZERO
#      fences: its command sits in prose inside description = """...""" with
#      inline backticks.
# Both would have MISSED real writers, which is the vacuous-check class. The
# surviving signal is file role, which is structural rather than textual:
#   .py/.sh                 executable in full
#   formulas/orders .toml   description/check/command fields, comments stripped
#   SKILL.md                agent-executed instruction in full
#   other .md               DESCRIPTIVE (POLICY, README, audits, plans) -- excluded
#
# Scope widened 2026-08-20 after trans's review: the first register scanned only
# assets/scripts/*.{py,sh} and was structurally blind to formulas and SKILL.md --
# the category the founding violation (adjudicate-brief) belongs to.
#
# role: authorized (inside mctl) | violation (writes from outside, dated,
#       may only shrink) | reader | unaudited (references it; NOT yet
#       classified -- an honest placeholder, also a burn-down)

