# Brief-pipeline filesystem layout (cache).
#
# Per brief-system POLICY.md B2.4/B2.8 (Adopted 2026-07-12): canonical brief
# state — pile/stack membership, adjudication status, defer state — lives in
# the BEAD STORE. Every path below is an implementation-detail cache,
# regenerable from bead state; on any disagreement the bead store wins and
# the filesystem is repaired to match.
#
# Paths are RIG-RELATIVE (resolve against <rig_root>), matching the live
# pilot layout at <rig_root>/.beads/briefs/ (hecke pilot: <city-root>/hecke).
# Scripts and formulas may override the root via BRIEF_ROOT / artifact_root
# pointing at <rig_root>/.beads/briefs.

[paths]
root = ".beads/briefs"
pile = ".beads/briefs/.pile"
no_brainer = ".beads/briefs/.pile/.no-brainer"
rejected = ".beads/briefs/.pile/.rejected"
# Destination for .bak snapshots retired after a successful revision. The
# directory already existed on disk but was referenced by no code (#20), so
# .bak snapshots accumulated as unreaped residue in the pile itself.
bak_archive = ".beads/briefs/.pile/.bak-archive"
stack = ".beads/briefs/stack"
archive = ".beads/briefs/archive"
presentations = ".beads/briefs/presentations"
decisions = ".beads/briefs/decisions"
decisions_log = ".beads/briefs/decisions.jsonl"
route_log = ".beads/briefs/decisions/file-or-sendback.jsonl"
manifest = ".beads/briefs/stack/.index.jsonl"
staging = ".beads/briefs/.staging"
lock = ".beads/briefs/.shuffle.lock"

# N5 kill-switch hierarchy (POLICY.md N5, Adopted 2026-07-12).
# Auto-execute is the DEFAULT; the switches below are safety brakes, not
# enablers. Semantics per level: file exists AND reads `false` -> halt
# auto-execution; absent or `true` -> proceed. Check order: city-wide first,
# then rig-level. Engaging or releasing a switch requires explicit the human adjudicator
# authorization recorded as a STANDALONE decision bead (a kill-switch
# authorization record — its own bead, NOT a brief verdict; unaffected by
# the one-bead model).
# (Supersedes the old opt-in ALLOW_NO_BRAINER_AUTO_EXECUTE file, whose
# EXISTENCE enabled automation.)
kill_switch_city = "<city-root>/.beads/auto_merge_enabled"
kill_switch_rig = ".beads/auto_merge_enabled"

# Mode tokens — brief-check.sh `no-brainer-execute-safety`.
#
# No-brainer auto-execution is a two-position RUNTIME MODE, DRY-RUN or ARMED,
# selected by the tokens below. It toggles in both directions at runtime with
# no edit to any skill or formula file:
#
#   observe   brief-check.sh no-brainer-mode        (read-only, always safe)
#   -> ARMED  write `true` to BOTH tokens           (deliberate; decision bead)
#   -> DRY-RUN brief-check.sh no-brainer-disarm     (one command, always allowed)
#              or delete either token, or let an `expires=` line lapse
#
# The brakes above are necessary but not sufficient. Absent-means-go is the
# wrong default for an irreversible act decided by a classifier whose own
# header still reads PRELIMINARY: it puts the brake in the "go" position on a
# fresh install, and a released brake reads identically to a deliberate
# decision to automate. Reaching ARMED therefore requires a POSITIVE token at
# BOTH levels below.
#
# Token format: first line exactly `true` selects ARMED; an optional second
# line `expires=<ISO-8601-utc>` makes it lapse back to DRY-RUN on its own so
# it cannot be left on by forgetting. A token reading `false` PINS dry-run.
# Absent / malformed / expired / pinned at either level = DRY-RUN, which
# behaves exactly as the old dry-run designation did. Mirrors mctl's adopted
# MCTL_ENABLE_LIVE_DISPATCH doctrine (mctl_core/work.py).
#
# Reaching ARMED takes two deliberate acts and explicit human authorization
# recorded as a STANDALONE decision bead. Returning to DRY-RUN takes one act,
# needs no authorization, and is always permitted — the recovery path is
# deliberately the easier one.
#
# NOTE: POLICY.md N5 as Adopted (2026-07-12) still says absent-or-true =
# proceed. This requirement is strictly MORE conservative than the adopted
# rule (it refuses where policy would permit, never the reverse). The N5
# amendment is DRAFTED, not adopted:
#   subdomains/brief-system/DRAFT-N5-ARMING-AMENDMENT.md
arm_token_city = "<city-root>/.beads/no_brainer_auto_execute_armed"
arm_token_rig = ".beads/no_brainer_auto_execute_armed"

# Durable N7 audit trail. Every no-brainer execution gate evaluation appends
# one JSON line here — PERMITTED and REFUSED alike, with the classifier state,
# category, confidence, and the full switch/arming state that produced the
# decision. An unwritable sink REFUSES rather than executing unreconstructably.
no_brainer_execution_log = ".beads/briefs/decisions/no-brainer-execution.jsonl"

[filenames]
brief = "brief.md"
evidence = "evidence.toml"
decision = "decision.toml"
breadcrumb = "breadcrumb.toml"
