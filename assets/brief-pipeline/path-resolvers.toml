# Files that name a brief path literal — the drift register for tdupu/mathcity#65.
#
# #65 asks for "one resolver" and, as its third condition, "a test that fails
# when a NEW writer appears with its own path logic". This file plus
# tests/brief-path-resolver-drift is that test.
#
# THE POPULATION IS THE POINT. Measured 2026-09-09: 70 files name a brief path
# literal and 63 of them never call `artifact_layout()`. That is too many to
# convert in one pass, and #65 says so — it is a stabilise-then-harden issue,
# not a sweep. So this register does what brief-writers.toml does for writers:
# records the known population with a date, and fails on anything NEW.
#
# THE LIST MAY SHRINK; IT MAY NOT GROW. Same rule as B2.12. A new file naming
# `.beads/briefs` fails the check until it either routes through
# `redundant_state.artifact_layout()` or is admitted here deliberately with a
# reason.
#
# `resolver = true` means the file ALSO calls artifact_layout — it names the
# literal but is not inventing its own answer (usually prose, a docstring, or a
# default that the resolver overrides). Those are not violations.
#
# The canonical resolver is:
#   assets/scripts/mctl_core/redundant_state.py :: artifact_layout(ctx)
# which resolves rig-relative via `_rig_relative(ctx.rig_root, ...)` and is what
# effects.py, briefs.py, work.py, schemas.py and mcp_server.py all use.

[meta]
measured = "2026-09-09"
canonical_resolver = "assets/scripts/mctl_core/redundant_state.py::artifact_layout"
total_files = 70
