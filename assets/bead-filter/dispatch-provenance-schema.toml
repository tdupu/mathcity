[schema]
id = "dispatch-provenance.v1"
description = "Append-only event payload used to attribute lost-bead failures to the dispatch or formula path that created them."

sources = [
  "mathcity.work",
  "simple-work",
  "priority-work",
  "gc-sling",
  "formula",
  "manual",
  "decisions-track",
  "unknown"
]

preflight_results = [
  "passed",
  "failed",
  "skipped",
  "unknown"
]

required_dispatch_fields = [
  "source",
  "created_at",
  "rig",
  "target",
  "formula",
  "preflight_result"
]
