# MEVT: mctl event participation (#202, Plan C). The typed surface rings the
# city's doorbells -- brief.submitted on deposit, brief.decided on adjudication
# -- so event-triggered orders fire within seconds instead of at the next
# condition tick. Emission is best-effort: the typed mutation is the source of
# truth and the condition backstop recovers a lost event, so a failed doorbell
# is a WARN advisory, never a FATAL on the effect plan.

[MEVT_EMIT_FAILED]
severity = "WARN"
meaning = "A best-effort city event (brief.submitted / brief.decided) could not be emitted; the typed mutation already succeeded and the condition backstop recovers the lost wake-up."
module = "gc_events.py"

# MDSH: dashboard lifecycle (#207). dashboard_status/dashboard_restart make the
# hand-launched `mctl dashboard serve` process visible and deliberately
# restartable from the typed surface. Restart stays a decision, never automatic
# (#164/#210), and every read obeys P6.2: an unknown serving commit is reported
# unknown, never a placeholder compared against origin/main.

[MEVT_EVENTS_UNREACHABLE]
severity = "WARN"
meaning = "The city event log could not be read, so events_list reports every population as null rather than an empty list. A city with no events and a log we could not open are different answers and this keeps them apart."
module = "ticker_read.py"

[MEVT_SCAN_TRUNCATED]
severity = "WARN"
meaning = "events_list read a bounded TAIL of the event log (measured 218 MB live), so its counts describe the window scanned and not the whole log. `available_in_scan` is named that way for the same reason: a tail must never be quoted as the population (#124). Treat every figure as a floor; `scan` reports log_bytes, scanned_bytes and truncated."
module = "ticker_read.py"
[MDSH_SELECTOR_UNRECORDED]
severity = "INFO"
meaning = "dashboard_restart was asked to rebind an instance whose stamp records no dashboard selection (pre-selector stamps carry 'unknown'), so the replacement serves 'both' -- which is what such an instance was already serving, making this a statement of fact rather than a change. Reported rather than substituted quietly, because 'both' asserted without a choice is the value dashboard_status deliberately refuses to invent (mc-i4d6u)."
module = "mcp_server.py"

[MDSH_STALE_INSTANCE]
severity = "WARN"
meaning = "A running dashboard is serving a commit other than the checkout's current HEAD; dashboard_status flags it so an operator can rebind deliberately with dashboard_restart. Not automatic -- #164 keeps restart a decision."
module = "mcp_server.py"

[MDSH_CHECKOUT_BEHIND_REMOTE]
severity = "WARN"
meaning = "The checkout the dashboards are served from is itself behind its remote-tracking ref, so an instance reporting stale=false may still be rendering old code -- MDSH_STALE_INSTANCE compares the PROCESS against ITS CHECKOUT and is structurally blind to this second axis (mc-dhsgo). The remedy is a pull THEN dashboard_restart; restarting alone rebinds to the same old code. The count is measured against the ref on disk and nothing fetches, so 0 means level-with-the-ref, never proof of freshness; when the ref does not resolve the count is null and checkout_freshness_known is false, never 0."
module = "mcp_server.py"

[MDSH_NO_INSTANCE]
severity = "ERROR"
meaning = "dashboard_restart was asked to restart a port with no live dashboard stamped for this city; refused rather than silently no-opping in a way that reads like success."
module = "mcp_server.py"

[MDSH_RESTART_FAILED]
severity = "ERROR"
meaning = "dashboard_restart could not stop the target instance, so nothing was started on top of a process that may still be up (P6.2 on the mutation); applied is false and the operator must check the process by hand."
module = "mcp_server.py"

# MDSH start/stop (mc-lj0sh). dashboard_serve/dashboard_teardown close the
# lifecycle to all four verbs #207 left split: an MCP-only Mayor can now bring a
# dashboard up from a cold start and take one down, not only observe and rebind.

[MDSH_PORT_IN_USE]
severity = "ERROR"
meaning = "dashboard_serve was asked to start on a port that already has a stamped dashboard for this city; refused rather than double-binding, symmetric with dashboard_restart's MDSH_NO_INSTANCE. Rebind the existing one with dashboard_restart, or start on another port."
module = "mcp_server.py"

[MDSH_CITY_SCREENS_DEGRADED]
severity = "WARN"
meaning = "dashboard_serve was asked for the city dashboard, whose own screens are degraded: /city and /orders have been measured taking ~112s with no response (mc-wbwel). The start is NOT refused -- an operator may want it anyway -- but a confirmed start means the process BOUND its port, which is not a claim that these screens render. Emitted so a hang cannot render as success."
module = "mcp_server.py"

[MDSH_SERVE_FAILED]
severity = "ERROR"
meaning = "dashboard_serve started a child that exited before it bound its port and stamped itself (P6.1): the start did not take. applied is false and nothing is serving -- another process may hold the port."
module = "mcp_server.py"

[MDSH_SERVE_STILL_STARTING]
severity = "WARN"
meaning = "dashboard_serve started a child that is still alive but had not stamped itself when the confirmation deadline elapsed (P6.3): a distinct non-failure state carrying elapsed, never rendered as a failed start. Call dashboard_status in a moment to confirm it bound."
module = "mcp_server.py"

[MDSH_SERVE_SLOW]
severity = "WARN"
meaning = "dashboard_serve confirmed the instance bound and stamped itself, but only after crossing the warn threshold beneath the deadline (P6.3): a latency note naming elapsed, not a failure. It is serving."
module = "mcp_server.py"

[MDSH_TEARDOWN_FAILED]
severity = "ERROR"
meaning = "dashboard_teardown could not stop a target instance, so its stamp was left in place and it is not counted as torn down (P6.2); the operator must check the process by hand."
module = "mcp_server.py"
