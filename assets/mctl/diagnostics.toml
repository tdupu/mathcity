# MBRF050-MBRF054 say *why* a closed brief has no readable verdict. `bd close`
# writes free text into `close_reason`, and across the live corpus that text is
# five different things; only one of them is a verdict. Reading the other four
# as verdicts would be the MBRF021 mass-false-positive failure again, so the
# adapter refuses and names the shape instead.

[MBRF050]
severity = "WARN"
meaning = "Closed brief's close_reason points at a successor bead; the decision was recorded there, not here."
policy_ref = "B2.2"
module = "verdicts.py"

[MBRF051]
severity = "WARN"
meaning = "Closed brief's close_reason reports work carried out against a verdict given earlier and elsewhere."
policy_ref = "B2.2"
module = "verdicts.py"

[MBRF052]
severity = "WARN"
meaning = "Closed brief was withdrawn, killed, or closed as moot; no verdict was given on it."
policy_ref = "B2.2"
module = "verdicts.py"

[MBRF053]
severity = "ERROR"
meaning = "Closed brief carries no readable verdict in any known field."
policy_ref = "B2.2"
module = "verdicts.py"

# MBRF054/MBRF055 name a decision bead that B2.1's Definitions paragraph
# already put outside the brief population -- "decision beads created for OTHER
# purposes (push authorizations, kill-switch engagement/release, non-brief
# adjudications) remain their own standalone beads". They are INFO because
# nothing is wrong with these beads; they are reported so that leaving the
# population is visible rather than looking like a bead that went missing.

[MBRF054]
severity = "INFO"
meaning = "Decision bead is a git-operation authorization receipt, not a brief; it belongs outside the brief population."
policy_ref = "B2.1"
module = "verdicts.py"

[MBRF055]
severity = "INFO"
meaning = "Decision bead records a kill-switch engagement or release, not a brief; it belongs outside the brief population."
policy_ref = "B2.1"
module = "verdicts.py"

# MBRF060-MBRF062 belong to the decisions-track manifest read as a third
# read-side source (manifest.py). The same file is also read strictly, for the
# B2.10 migration gate, where a single bad line must fail the whole read
# (MBRF013). These three are the tolerant pass: they cost one row's visibility
# each and are WARN, because a supplementary source that loses a row must not
# also take down the listing that 197 bead-backed briefs are in.

[MBRF060]
severity = "WARN"
meaning = "Decisions-track manifest could not be read, so its rows are unreachable."
policy_ref = "B2.10"
module = "manifest.py"

[MBRF061]
severity = "WARN"
meaning = "Decisions-track manifest row is not readable JSON, or is not a JSON object, and was skipped."
policy_ref = "B2.10"
module = "manifest.py"

[MBRF062]
severity = "WARN"
meaning = "Decisions-track manifest row carries no slug, so it has no identity to show."
policy_ref = "B2.10"
module = "manifest.py"

# MBRF063-MBRF066 belong to the body join Slice 7 added. Slice 6 read the
# manifest without ever listing the directory it sits in, which holds 204
# markdown bodies; 35 of the 36 rows it called "unreadable" have one. These
# four say what happened per row, and are WARN for the same reason as
# MBRF060-062: losing one brief's body must not take down the listing.

[MBRF063]
severity = "WARN"
meaning = "Decisions-track row has no brief body file, so what it said cannot be shown. This, and only this, is what `unreadable` means."
policy_ref = "B2.10"
module = "manifest.py"

[MBRF064]
severity = "WARN"
meaning = "Brief body file could not be read, or is empty, so the row keeps only what its manifest row says."
policy_ref = "B2.10"
module = "manifest.py"

[MBRF065]
severity = "WARN"
meaning = "Brief body file has no parseable frontmatter, so its recorded fields are unavailable."
policy_ref = "B2.10"
module = "manifest.py"

[MBRF066]
severity = "WARN"
meaning = "More than one brief body file normalises to the same slug; the sorted-first file was used."
policy_ref = "B2.10"
module = "manifest.py"

# MBRF067-MBRF068 belong to the stack directory read as a fourth read-side
# source (documents.py). Slices 6 and 7 suppressed 46 manifest rows because a
# stack file "already represented" them, while nothing read stack files at all
# -- so the dedup subtracted 46 briefs and added none. The stack is now read,
# the join merges rather than drops, and these two say what the join found.
# WARN for the same reason as MBRF060-066: a document either source cannot use
# costs that brief's visibility and nothing else.

[MBRF067]
severity = "WARN"
meaning = "Brief stack directory could not be listed, so its files are unreachable."
policy_ref = "B2.10"
module = "documents.py"

[MBRF068]
severity = "WARN"
meaning = "One brief is stored twice with different text -- a stack file and a decisions-track snapshot; the stack file is shown and the other copy is named in `also_recorded_in`."
policy_ref = "B2.10"
module = "documents.py"

