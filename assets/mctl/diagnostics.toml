# mctl diagnostic code registry.
#
# Single source of truth for stable diagnostic codes. Plan §4's invariant
# table is generated from this file, and tests/mctl/test_diagnostics_registry.py
# asserts that every code mctl_core emits is registered here and every
# registered code is still reachable in the source. Without that pairing the
# plan and the code drift apart silently, which is how MBRF010-MBRF013 came to
# exist in code but nowhere in the plan.

[MBRF001]
severity = "ERROR"
meaning = "Stack index row points at a missing file."
policy_ref = "B2.8"
module = "briefs.py"

[MBRF002]
severity = "ERROR"
meaning = "Brief cache file exists with no matching decision bead."
policy_ref = "B2.1"
module = "briefs.py"

[MBRF003]
