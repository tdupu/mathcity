description = "Pack-local operator that runs the deterministic brief-pipeline machine steps (shuffle bookkeeping, watchdog refill measurement, decision dispatch, archive sweeps, no-brainer classification). Never adjudicates, never presents to the human adjudicator."
scope = "city"
wake_mode = "fresh"
work_dir = "{{.AgentBase}}"
nudge = "Run gc hook --claim --json now; if it returns a brief-pipeline machine step, execute the claimed formula immediately."
idle_timeout = "2h"
# MUST stay 0 while wake_mode = "fresh". Do not "restore the warm session" by
# raising this — that pairing is self-defeating and wedges the pool at zero
# members (issue #10).
#
# Why: min_active_sessions >= 1 creates standing pool demand, so whenever the
# member is not live the reconciler issues a RESUME against the existing
# session bead. wake_mode = "fresh" makes that resume replay a stale/dead
# session's pre_start hook, which hangs and is killed at the ~30s resume
# deadline. Every following reconcile re-attempts the identical doomed resume,
# so a live member is never materialized.
#
# gascity guards exactly this case in cmd/gc/pool_desired_state.go
# (gastownhall/gascity#4849), but only when the session bead is in StateAsleep.
# Sessions wedged this way are observed in `creating` / `start-pending` and
# never reach `asleep`, so the guard does not fire for us.
#
# The prior value of 1 was introduced to keep "at least one session warm" and
# avoid on_demand dispatch (open bug gs-7mr). It did the opposite: it
# guaranteed ZERO sessions, permanently — strictly worse than the on_demand
# path it was working around. gs-7mr's current status was NOT re-verified when
# this was changed; if on_demand staffing misbehaves again, fix it there or
# broaden the gascity guard, but do NOT re-pair min >= 1 with wake_mode
# "fresh". Enforced by tests/brief-operator-pool-config/smoke_test.sh.
#
# Trade-off accepted: no always-warm member, so the first brief-pipeline step
# after an idle period pays a cold start.
min_active_sessions = 0
# TEMPORARY workaround gt-rr2gz1 (brief #92, Option B, 2026-08-13): cap at three
# is NOT a derived capacity number — it is a holding value while the pool keeps
# getting trapped. Removal trigger: tdupu/mathcity#9 (brief-shuffle
# workflow-finalize head-close hard-quarantines every run and traps operators;
# deployed gc lacks upstream #5020). Re-derive or retire this cap once #9's
# finalize-quarantine fix is deployed.
max_active_sessions = 3
