description = "City-scope Mayor for a mathcity city: surveys city state, decides what should run next, dispatches through the fleet, and hands off to its successor. Adjudicates nothing — verdicts belong to the human adjudicator; the Mayor prepares and routes, never decides a brief."

scope = "city"
wake_mode = "fresh"

# The city defines `mayor-model` (see this pack's pack.toml for why the pack
# cannot). Naming it here rather than inheriting the city default is what lets
# a city pin the Mayor's model without changing every other agent's.
#
# The Mayor's work is judgment under incomplete information — deciding what the
# city should do next and refusing work that should not run — so it is the one
# role where model capability changes the answer rather than the latency.
provider = "mayor-model"

# The Mayor gets its OWN work_dir, and this is load-bearing, not cosmetic.
#
# MCP is projected per-workdir: every agent sharing a workdir projects to the
# same <workdir>/.mcp.json. Two city-scope agents that share the city root and
# project DIFFERENT content collide, and that collision is FATAL to city init:
#
#   MCP target conflict at <city-root>/.mcp.json (claude):
#     mayor.mayor projects <hash-a> but claude-agexplained projects <hash-b>
#   gc-fatal: init: project MCP
#
# The city then never starts; it retries with backoff. Measured 2026-09-07:
# dropping this line took a live city down through five init failures.
#
# The stock Gas City mayor shipped work_dir = ".gc/agents/mayor". It read as an
# arbitrary subtree and was removed on that assumption. It exists to keep the
# Mayor off the shared MCP target. The path is inside the city root, so gc
# still discovers the city by walking up; the Mayor manages the city, it does
# not need to sit in its root.
work_dir = ".gc/agents/mayor"

idle_timeout = "1h"

# MUST stay 0 while wake_mode = "fresh". This is the same trap documented at
# length on mathcity's brief-operator (their issue #10): min >= 1 creates
# standing pool demand, so the reconciler issues a RESUME against the existing
# session bead whenever no member is live; wake_mode = "fresh" makes that
# resume replay a dead session's pre_start hook, which hangs and is killed at
# the resume deadline, and every following reconcile re-attempts the identical
# doomed resume. The result is permanently ZERO members — strictly worse than
# the cold start it was meant to avoid.
#
# gascity guards this only when the session bead is StateAsleep
# (cmd/gc/pool_desired_state.go, gastownhall/gascity#4849); wedged sessions sit
# in `creating`/`start-pending` and never reach `asleep`, so the guard does not
# fire. Do not "keep the Mayor warm" by raising this.
min_active_sessions = 0

# One Mayor. Two would race on the same city-scope decisions and dispatch the
# same work twice; the role is a serialization point by design, not a pool.
max_active_sessions = 1
