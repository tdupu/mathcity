description = """
`mathcity.work` boundary router.

There are two ways to do work:

1. Continue already well-defined work with a clear graph. The bead already
   says what formula/graph should run, or it is a bounded task whose briefed
   path is mechanically obvious.
2. Commission fresh or ambiguous work. The city first produces a commission
   brief that preserves the original request, normalizes the objective, checks
   existing work, proposes a dispatch graph, and waits for approval before any
   implementation dispatch occurs.

The route step does not implement work. It delegates to a `-briefed` formula:
simple/full known work continues directly, while fresh/ambiguous work delegates
to `commission-work-briefed`.
"""
formula = "work-briefed"
version = 2

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "work-briefed"
description = "mathcity.work router: continue clear work directly, or commission fresh/ambiguous work through an approval brief before dispatch."

[vars]
[vars.source_bead]
description = "The work bead ID to route. The router reads this bead's description, notes, and dependencies."
required = true

[vars.artifact_root]
description = "Build/stage artifact root ONLY. Scope per bead (for example <rig-root>/.gc-builds/<bead>) so two concurrent dispatches in one rig do not share a stage root (gsp-1bmxuz). It is NOT a brief root — see brief_root."
required = true

[vars.brief_root]
description = "Brief DEPOSIT root: the rig's one shared brief tree, absolute, never bead-scoped. Pass <rig-root>/.beads/briefs — the pile every adjudication surface reads. Required, and deliberately without a default: a rig-relative default resolves against the runner's cwd, which is an agent work dir and never a brief root, so a wrong root would be inherited silently instead of refused loudly (mc-4ovmy)."
required = true

[vars.brief_slug]
description = "Stable slug for the brief artifact."
required = true
pattern = "^[A-Za-z0-9._-]+$"

[vars.task]
description = "Optional exact task text for bounded simple work. If empty, the router derives task context from the bead title/description."
default = ""

[vars.context]
description = "Optional extra context for commission or direct simple work."
default = ""

[vars.model]
description = "Model for simple-path task execution. Ignored by commissioned and full-build paths."
default = "haiku"
enum = ["haiku", "sonnet", "opus"]

[vars.brief_type]
description = "Brief type for simple-path filing."
default = "standard"
enum = ["standard", "decision", "no-brainer"]

[vars.interaction_mode]
description = "Interaction posture passed to build-basic-briefed on full-build path."
default = "autonomous"

[vars.review_mode]
description = "Review authority passed to build-basic-briefed on full-build path."
default = "report"

[vars.drain_policy]
description = "Implementation drain policy passed to build-basic-briefed on full-build path."
default = "separate"

[vars.push]
description = "Whether to allow final push. Passed only to formulas that support it. Default false: brief-only."
default = "false"

[vars.open_pr]
description = "Whether to open a PR. Passed only to formulas that support it. Default false: brief-only."
default = "false"

[vars.child_run_target]
description = "Child dispatch target. Use auto to resolve <owning-rig>/gc.run-operator from source_bead via gc rig list --json."
default = "auto"

[vars.routing_path]
description = "Comma-separated route prefix for nested routers."
default = "mathcity.work"

[[steps]]
id = "route"
title = "Route {{source_bead}} through mathcity.work"
# Rig-scoped, deliberately. `mathcity.brief-operator` is scope="city" with
# work_dir="{{.AgentBase}}", which resolves to <city-root>/mathcity.brief-operator-N —
# directories with no .beads and no git repo, so bd walks up and binds the HQ store.
# A route step pinned there cannot address rig beads at all: `bd show mc-hs3` returned
# "no issue found" while 18 mc-* beads sat unclaimed. Bare `gc.run-operator` is
# scope="rig" with no work_dir override, inherits executionRigContext from the parent
# mathcity.work run, and therefore follows the SOURCE BEAD's store (rig for mc-*, HQ
# for gt-*). Matches sibling planning-briefed.formula.toml, which already uses bare
# gc.run-operator for its entry step (:70) and reserves mathcity.brief-operator for the
# city-scoped brief-FILING step (:198). Do NOT "fix" this by changing the agent's scope
# — city scope is load-bearing for the rigless HQ brief-shuffle-pile override
# (city.toml:96-105). See decisions-track #149, tdupu/mathcity#23.
metadata = { "gc.run_target" = "gc.run-operator" }
description = """
You are the routing gate for `mathcity.work`. Read the source bead, enumerate
live formulas, and either continue a clear work graph or commission a dispatch
plan. Do not perform implementation yourself.

## Step 1 — Read source state

```bash
bd show {{source_bead}}
bd dep tree {{source_bead}} --readonly || true
```

## Step 2 — Enumerate the live formula and agent catalogs

```bash
FORMULAS="$(gc formula list 2>/dev/null || true)"
AGENTS="$(gc agent list 2>/dev/null || true)"
printf '%s\n' "$FORMULAS" | sort
printf '%s\n' "$AGENTS" | sort
```

The dispatch-planning formula owns formula selection for fresh work. This
router only chooses whether work is already clear enough to continue. A
continue path is executable only when the selected formula appears in
`$FORMULAS` and the selected `gc.run_target` appears in `$AGENTS`.

## Step 3 — Choose a route

Choose **COMMISSION** when any of these are true:

- The user request is fresh, ambiguous, or likely to lose meaning in translation.
- The work needs formula selection, experiment routing, decomposition, or graph design.
- Existing work may already cover the objective and must be folded in.
- A plan/design brief should confirm what the user meant before dispatch.
- The bead does not already contain explicit formula/graph/test/brief gates.

Choose **SIMPLE_CONTINUE** only when all of these are true:

- It is a single bounded operation with a clear output.
- No planning, decomposition, experiment qualification, or duplicate-work
  reconciliation is needed.
- The result can be briefed immediately after execution.
- `simple-work-briefed` is present in the live catalog.

Choose **FULL_CONTINUE** only when the bead is already a well-defined
implementation request and the graph shape is clear enough for the full
requirements → plan → decompose → implement → review → result-brief path.
If the question is "what should the graph be?", choose COMMISSION.

Choose **EXPLICIT_CONTINUE** when the bead already names an approved formula
and vars to sling, and that formula is present in the live catalog.

## Step 4 — Record the route event

```bash
for cmd in bd gc jq; do
  command -v "$cmd" >/dev/null 2>&1 || {
    echo "I'm sorry, I can't do that — required command '$cmd' is missing." >&2
    exit 1
  }
done

route_payload="$(jq -nc \
  --arg schema "mathcity-work-route.v2" \
  --arg source_bead "{{source_bead}}" \
  --arg route "<COMMISSION|SIMPLE_CONTINUE|FULL_CONTINUE|EXPLICIT_CONTINUE>" \
  --arg child_formula "<commission-work-briefed|simple-work-briefed|build-basic-briefed|explicit-formula>" \
  --arg reason "<one-line reason>" \
  '{schema:$schema,source_bead:$source_bead,route:$route,child_formula:$child_formula,reason:$reason}')"
route_event="$(bd create "mathcity.work route for {{source_bead}}" \
  --type=event \
  --event-category mathcity_work.route \
  --event-target "{{source_bead}}" \
  --event-payload "$route_payload" \
  --silent)"
bd dep relate "$route_event" "{{source_bead}}"
```

## Step 5 — Verify no active worker or child workflow already owns the bead

```bash
assignee="$(bd show "{{source_bead}}" --json --readonly | jq -r '.[0].assignee // .assignee // ""')"
if [ -n "$assignee" ]; then
  echo "ALREADY DISPATCHED — bead {{source_bead}} has active assignee: $assignee; aborting duplicate mathcity.work dispatch" >&2
  exit 1
fi
bd dep list "{{source_bead}}" --readonly || true
```

Review the dependency/dependent list for an active child workflow already
routed from this source bead. If an open or in-progress child workflow exists
for this objective, abort instead of dispatching a duplicate. If the child graph
is stale, ambiguous, closed-but-incomplete, or missing routing metadata, choose
COMMISSION so the approval brief can reconcile it explicitly.

## Step 6 — Resolve child run target

```bash
resolve_child_run_target() {
  requested="{{child_run_target}}"
  if [ "$requested" != "auto" ]; then
    printf '%s\n' "$requested"
    return 0
  fi

  registry_json="$(gc rig list --json)" || {
    echo "ROUTE TARGET FAILED — gc rig list --json is unavailable; pass --var child_run_target=<rig>/gc.run-operator explicitly" >&2
    return 1
  }
  rig_name="$(printf '%s' "$registry_json" | jq -r --arg id "{{source_bead}}" '
    [(.rigs // [])[] | select(.prefix as $p | $id | startswith($p + "-"))]
    | sort_by(.prefix | length) | last // empty
    | .name // empty')"
  if [ -z "$rig_name" ]; then
    echo "ROUTE TARGET FAILED — no configured rig prefix matches {{source_bead}}; pass --var child_run_target=<rig>/gc.run-operator explicitly" >&2
    return 1
  fi

  printf '%s/gc.run-operator\n' "$rig_name"
}

CHILD_RUN_TARGET="$(resolve_child_run_target)" || exit 1

printf '%s\n' "$AGENTS" | grep -F "$CHILD_RUN_TARGET" >/dev/null 2>&1 || {
  echo "ROUTE TARGET FAILED — $CHILD_RUN_TARGET is not in the live agent catalog" >&2
  exit 1
}
```

## Step 7 — Dispatch the selected child formula

If **COMMISSION**, dispatch commissioning only. This files a commission brief
and does not dispatch implementation before approval:

```bash
printf '%s\n' "$FORMULAS" | awk '{print $1}' | grep -qx 'commission-work-briefed' || {
  echo "ROUTE TARGET FAILED — commission-work-briefed is not in the live formula catalog" >&2
  exit 1
}
gc sling "$CHILD_RUN_TARGET" {{source_bead}} --on commission-work-briefed \
  --var source_bead={{source_bead}} \
  --var brief_slug={{brief_slug}} \
  --var commission_mode=fresh \
  --var artifact_root={{artifact_root}} \
  --var brief_root={{brief_root}} \
  --var context="{{context}}" \
  --var routing_path="{{routing_path}},commission-work-briefed"
```

If **SIMPLE_CONTINUE**, dispatch simple-work-briefed:

```bash
TASK="{{task}}"
if [ -z "$TASK" ]; then
  TASK="$(bd show {{source_bead}} | head -20)"
fi
gc sling "$CHILD_RUN_TARGET" {{source_bead}} --on simple-work-briefed \
  --var source_bead={{source_bead}} \
  --var brief_slug={{brief_slug}} \
  --var model={{model}} \
  --var brief_type={{brief_type}} \
  --var artifact_root={{artifact_root}} \
  --var brief_root={{brief_root}} \
  --var routing_path="{{routing_path}},simple-work-briefed" \
  --var task="$TASK" \
  --var context="{{context}}"
```

If **FULL_CONTINUE**, dispatch build-basic-briefed:

```bash
gc sling "$CHILD_RUN_TARGET" {{source_bead}} --on build-basic-briefed \
  --var artifact_root={{artifact_root}} \
  --var interaction_mode={{interaction_mode}} \
  --var review_mode={{review_mode}} \
  --var drain_policy={{drain_policy}} \
  --var push={{push}} \
  --var open_pr={{open_pr}} \
  --var routing_path="{{routing_path}},build-basic-briefed"
```

If **EXPLICIT_CONTINUE**, execute the already-approved command/vars from the
source bead. Before running it, verify the named formula appears in `$FORMULAS`
and that its terminal path is briefed or explicitly routes to a briefed formula.

## Step 8 — Verify assignment

```bash
sleep 5
child_assignee="$(bd show "{{source_bead}}" --json --readonly | jq -r '.[0].assignee // .assignee // ""')"
if [ -z "$child_assignee" ]; then
  echo "DISPATCH VERIFY FAILED — bead {{source_bead}} has no assignee after mathcity.work child sling" >&2
  exit 1
fi
```

Then close this routing step and drain:

```bash
bd update <this-step-bead-id> --append-notes "Dispatched {{source_bead}} via <child formula>. Route molecule started."
gc runtime drain-ack
```
"""
