description = """
Group downstream lost-bead classifications into upstream repair candidates.
This formula consumes an export cache generated from linked classification/provenance event beads; it files linked repair decision brief beads and never patches formulas directly.
"""
formula = "lost-bead-upstream-repair-rollup"
version = 1

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "lost-bead-upstream-repair-rollup"
description = "Create upstream repair-brief candidates from repeated lost-bead fingerprints."

[vars]
[vars.classification_root]
description = "Directory containing exported lost-bead-classification.v1 and dispatch-provenance.v1 TOML cache records generated from linked event beads."
default = ".beads/lost-bead-classifications"

[vars.output_path]
description = "JSONL file receiving candidate upstream repair briefs."
default = ".beads/lost-bead-classifications/upstream-candidates.jsonl"

[vars.threshold]
description = "Distinct bead count required for tight source/fingerprint match."
default = "3"

[vars.artifact_root]
description = "Brief pipeline artifact root."
default = ".beads/briefs"

[vars.operator_target]
description = "Run target for upstream rollup and brief filing."
default = "mathcity.brief-operator"

[[steps]]
id = "group-upstream-patterns"
title = "Group upstream failure patterns"
metadata = { "gc.run_target" = "{{operator_target}}" }
description = """
Run `mathcity/assets/scripts/checks/lost-bead-filter-check.sh {{classification_root}}` first. If it emits an `I'm sorry, I can't do that` dependency message, stop with that message and do not file a brief.
Run `mathcity/assets/scripts/lost-bead-filter.py rollup-upstream --input {{classification_root}} --threshold {{threshold}} --output {{output_path}}`.
Ignore records whose `root_cause.repair_candidate` is false.
Group by dispatch source, formula or target, root-cause class, and fingerprint.
Unknown provenance must be grouped as `UNKNOWN_PROVENANCE` and must not be attributed to `mathcity.work`.
If validation fails, stop with the script's nonzero exit and do not file a brief.
"""

[[steps]]
id = "file-brief"
title = "File upstream repair decision brief"
needs = ["group-upstream-patterns"]
metadata = { "gc.run_target" = "{{operator_target}}", "gc.brief.root" = "{{artifact_root}}" }
description = """
Read `{{output_path}}`.
For each `upstream_repair_brief` row, file one decision brief into `{{artifact_root}}/.pile/`.
Create the canonical brief as `bd create --type decision`, link it to every contributing classification/provenance event bead and affected source bead with `bd dep add <brief-id> <source-id> --type related`, then write the markdown printout and manifest cache row.
The brief asks: "Approve repair R to prevent future beads with failure fingerprint F from being lost?"
Include examples, what happened to each bead, shared fingerprint, suspected source path, confidence, alternative explanations, proposed target, exact non-goal, replay command, and expected reduction in manual triage.
This formula does not patch skills, formulas, gates, policy, or bead lifecycle state directly.
If no group reaches threshold, record `no upstream repair candidate at threshold` and exit cleanly.
"""
