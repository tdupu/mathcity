description = """
Simple-work with a brief filing terminal slot.

A lightweight alternative to build-basic-briefed for bounded, well-scoped
tasks that do not need the full requirements → plan → decompose → implement →
review → finalize cycle.

Selects a model (default: haiku for simple mechanical work; caller may
override to sonnet or opus), executes the task in a single step, then files
a decision brief to the brief pipeline via the mathcity.brief-prep skill.

Use when:
- The task is a single, bounded operation (a script run, a database update,
  a text generation, a verification pass, a label check).
- The result still needs the human adjudicator's adjudication before anything ships.
- build-basic-briefed is overkill — no planning, decompose, or finalize needed.

Does NOT: run requirements / plan / decompose / implement / finalize.
Does NOT: push code or open PRs.
"""
formula = "simple-work-briefed"
version = 1

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "simple-work-briefed"
description = "Execute a bounded task with a configurable model, then file a brief for human adjudication."

[vars]
[vars.task]
description = "The task to perform. State exactly what to do, what inputs to read, and what output is expected."
required = true

[vars.context]
description = "Optional context: file paths, bead IDs, or content to read before executing. Leave empty if not needed."
default = ""

[vars.source_bead]
description = "Bead ID this work is for. Used as the brief source and for recording output."
required = true

[vars.brief_slug]
description = "Stable slug for the brief artifact (used as the brief filename stem)."
required = true
pattern = "^[A-Za-z0-9._-]+$"

[vars.model]
description = "Model for task execution. Default haiku: fast, sufficient for simple bounded work. Use sonnet for tasks needing light reasoning; opus for high-stakes judgment."
default = "haiku"
enum = ["haiku", "sonnet", "opus"]

[vars.brief_type]
description = "Brief type filed after execution."
default = "standard"
enum = ["standard", "decision", "no-brainer"]

[vars.run_target]
description = "Pool that runs both formula steps."
default = "mathcity.brief-operator"

[vars.artifact_root]
description = "Build/stage artifact root. Scope per bead (for example <rig-root>/.gc-builds/<bead>) so two concurrent dispatches in one rig do not share a stage root (gsp-1bmxuz). This is NOT the brief deposit root — see brief_root."
default = ".beads/briefs"

[vars.brief_root]
description = "Brief DEPOSIT root: the rig's one shared brief tree, never bead-scoped. mctl resolves the pile every adjudication surface reads as <rig-root>/.beads/briefs/.pile (assets/brief-pipeline/paths.toml, rig-relative); a brief deposited anywhere else has no route to a human (mc-4ovmy). A relative value is resolved against the rig root from the city registry, never against the runner's cwd."
default = ".beads/briefs"

[vars.routing_path]
description = "Comma-separated route from wrapper formula to final producer."
default = "simple-work-briefed"

[[steps]]
id = "execute-task"
title = "Execute: {{task}}"
metadata = { "gc.run_target" = "{{run_target}}", "gc.brief.source" = "{{source_bead}}" }
description = """
Spawn a subagent (Agent tool, model override: {{model}} — selected by the
caller as appropriate for this task's complexity) and give it this task:

---
{{task}}
---

{{context}}

The subagent must complete the task as described and return its full output
as its final message. That output becomes the evidence for the brief.

When the subagent completes, record a summary of the result in this step
bead's notes:

```bash
bd update <this-step-bead-id> --append-notes "<one-paragraph result summary>"
```

Then close this step bead and call `gc runtime drain-ack`.

If blocked without a path forward, file an escalation before stopping:

```bash
"<mathcity-pack-root>/assets/scripts/escalate.sh" \
  --title "simple-work-briefed stalled on {{source_bead}}" \
  --priority 2
```

The helper ships in the mathcity pack, not in any rig; resolve
`<mathcity-pack-root>` as the parent of the `orders/` directory on the
`Source:` line of `gc order show simple-work-briefed`. Your cwd is a per-bead work dir,
never the pack root, so a bare `assets/...` resolves to nothing, and
`$PACK_DIR` is not a substitute — gascity injects it for order dispatch and
`gc` custom commands only, never into a formula step's agent session.
"""

[[steps]]
id = "file-brief"
title = "File brief for {{source_bead}}"
needs = ["execute-task"]
metadata = { "gc.run_target" = "{{run_target}}", "gc.brief.slug" = "{{brief_slug}}", "gc.brief.source" = "{{source_bead}}", "gc.brief.source_formula" = "simple-work-briefed", "gc.brief.source_step" = "file-brief", "gc.brief.routing_path" = "{{routing_path}}", "gc.brief.producer_contract" = "brief-producer.v1", "gc.brief.type" = "{{brief_type}}", "gc.brief.path" = "{{brief_root}}/.pile/{{brief_slug}}.md" }
description = """
Use the `mathcity.brief-prep` skill to prepare and file a brief about the
result of the `execute-task` step.

First read the execute-task result from the source bead notes:

```bash
bd show {{source_bead}}
```

Deposit to `brief_root`, NOT to `artifact_root`. `artifact_root` is bead-scoped
so concurrent builds do not collide; a brief deposited under it inherits that
scoping and lands in a per-bead directory no adjudication surface reads. That is
mc-4ovmy — six of the eighteen stranded briefs came from THIS step.

Resolve the root from the CITY REGISTRY, never from this runner's cwd — the cwd
is an agent work dir, which is never a rig root and never a brief root.

```bash
BRIEF_ROOT="{{brief_root}}"
case "$BRIEF_ROOT" in
  /*) ;;
  *)
    RIG_PATH="$(gc rig list --json | jq -r --arg id "{{source_bead}}" '
      [(.rigs // [])[] | select(.prefix as $p | $id | startswith($p + "-"))]
      | sort_by(.prefix | length) | last // empty
      | .path // empty')"
    [ -n "$RIG_PATH" ] || {
      echo "I'm sorry, I can't do that — no registered rig prefix matches {{source_bead}}, so the brief deposit root cannot be resolved. Pass --var brief_root=<rig-root>/.beads/briefs." >&2
      exit 1
    }
    BRIEF_ROOT="$RIG_PATH/$BRIEF_ROOT"
    ;;
esac
```

Then invoke the brief-prep skill with:
- source: `{{source_bead}}`
- slug: `{{brief_slug}}`
- type: `{{brief_type}}`
- artifact_root: `$BRIEF_ROOT` (the resolved brief deposit root above)

The brief's "What is being decided" section must describe the action taken
and what the human adjudicator needs to approve, reject, or defer. Include the subagent
output as the primary evidence section.

The deposited brief must include this provenance frontmatter:

```yaml
producer_contract: brief-producer.v1
source_formula: simple-work-briefed
source_step: file-brief
routing_path: "{{routing_path}}"
```

After `mathcity.brief-prep` completes and the brief is in `.pile/`, close
this step bead and call `gc runtime drain-ack`.
"""
