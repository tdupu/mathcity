description = """
Record producer-failure signals for gate-rejected briefs.

This formula is idempotent: every run scans `.pile/.rejected` and records only
rejected briefs that do not already have a producer-failure cache file.
Canonical durable state is the linked event bead where available; cache files
are regenerable inspection state.
"""
formula = "brief-producer-failure-record"
version = 1

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "brief-producer-failure-record"
description = "Record producer-failure signals from brief-shuffle gate rejects."

[vars]

[vars.artifact_root]
description = "Brief pipeline artifact root."
default = ".beads/briefs"

[vars.operator_target]
description = "Run target for producer-failure recording."
default = "mathcity.brief-operator"

[[steps]]
id = "scan-rejected"
title = "Find rejected briefs missing producer-failure records"
metadata = { "gc.run_target" = "{{operator_target}}", "gc.brief.root" = "{{artifact_root}}" }
description = """
Scan `{{artifact_root}}/.pile/.rejected/*/brief.md` and flat rejected markdown
files if any legacy rejects exist. For each rejected brief, derive `slug` from
the rejected path and skip it when
`{{artifact_root}}/.producer-failure-pile/<slug>.toml` already exists.

Write the list of unrecorded slugs to
`$GC_WORK_DIR/unrecorded-producer-failures.txt`.

If there are no unrecorded rejects, record `no unrecorded producer failures`
and complete successfully.
"""

[[steps]]
id = "record-signals"
title = "Record producer-failure signals"
needs = ["scan-rejected"]
metadata = { "gc.run_target" = "{{operator_target}}", "gc.brief.root" = "{{artifact_root}}" }
description = """
Before recording signals, verify runtime dependencies:

```bash
for cmd in bd gc jq; do
  command -v "$cmd" >/dev/null 2>&1 || {
    echo "I'm sorry, I can't do that — required command '$cmd' is missing." >&2
    echo "Install '$cmd' or run the appropriate setup/update skill before recording producer failures." >&2
    exit 1
  }
done
```

For each slug in `$GC_WORK_DIR/unrecorded-producer-failures.txt`, read the
rejected brief and rejection record. Extract:

- `brief_id` from `brief_slug` or the slug path
- `brief_path`
- `source_bead` from `gc.brief.source`, `brief_bead`, or the stack manifest source
- `source_formula`
- `source_step`
- `routing_path`
- `producer_contract`
- `failed_gate`
- `failed_gate_name`
- `failure_summary`
- `failure_fingerprint`

If `producer_contract: brief-producer-repair.v1` is present, skip the brief;
repair briefs are self-excluded.

Write `{{artifact_root}}/.producer-failure-pile/<slug>.toml` with schema
`brief-producer-failure.v1` and these fields:

```toml
schema = "brief-producer-failure.v1"
brief_id = "<slug>"
brief_path = "{{artifact_root}}/.pile/.rejected/<slug>/brief.md"
source_bead = "<source bead id or unknown>"
source_formula = "<producer formula or unknown>"
source_step = "<terminal step or unknown>"
routing_path = ["<route entries>"]
failed_gate = "<gate id>"
failed_gate_name = "<gate name>"
failure_summary = "<one sentence>"
failure_fingerprint = "<lowercase-dash-fingerprint>"
observed_at = "<RFC3339 UTC>"
status = "untriaged"
dedupe_key = "<source_formula>:<failed_gate>:<failure_fingerprint>:<source_bead>"
```

Create a linked event bead with the same payload:

```bash
payload="$(jq -nc \
  --arg schema "brief-producer-failure.v1" \
  --arg brief_id "$slug" \
  --arg brief_path "$brief_path" \
  --arg source_bead "$source_bead" \
  --arg source_formula "$source_formula" \
  --arg source_step "$source_step" \
  --arg routing_path "$routing_path_json" \
  --arg failed_gate "$failed_gate" \
  --arg failed_gate_name "$failed_gate_name" \
  --arg failure_summary "$failure_summary" \
  --arg failure_fingerprint "$failure_fingerprint" \
  --arg dedupe_key "$dedupe_key" \
  '{schema:$schema,brief_id:$brief_id,brief_path:$brief_path,source_bead:$source_bead,source_formula:$source_formula,source_step:$source_step,routing_path:$routing_path,failed_gate:$failed_gate,failed_gate_name:$failed_gate_name,failure_summary:$failure_summary,failure_fingerprint:$failure_fingerprint,dedupe_key:$dedupe_key}')"
event_bead="$(bd create "producer failure: $slug" \
  --type=event \
  --event-category brief.producer_failure \
  --event-target "$source_bead" \
  --event-payload "$payload" \
  --silent)"
bd dep relate "$event_bead" "$source_bead" || true
gc event emit brief.producer_failure_recorded --subject "$slug"
```

If cache write or event creation fails, emit
`brief.producer_failure_record_failed` with the slug and exit nonzero.
"""
